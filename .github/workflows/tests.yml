name: Solo-MCP tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  native-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the actual desktop runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 imagemagick x11-utils
      - name: Native GTK bootstrap window smoke
        run: |
          xvfb-run -a env GDK_BACKEND=x11 /usr/bin/python3 - <<'PYGTK'
          import solo_bootstrap_ui as solo
          Gtk, GLib, Gdk = solo._gtk()
          win, body = solo._shell(Gtk, Gdk, 'Preparar Solo')
          body.pack_start(solo._label(Gtk, 'PRIMEIRA ABERTURA', 'solo-eyebrow'), False, False, 0)
          body.pack_start(solo._label(Gtk, 'Solo usa o motor gráfico do seu sistema.', 'solo-title'), False, False, 0)
          body.pack_start(solo._divider(Gtk), False, False, 0)
          win.show_all()
          for _ in range(8):
              if Gtk.events_pending():
                  Gtk.main_iteration()
          assert win.get_visible()
          win.destroy()
          print('Native Solo GTK OK')
          PYGTK
      - name: Native WebKit workflow smoke
        run: xvfb-run -a env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 SOLO_MCP_GUI_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_ui.py -v
      - name: Selected GTK window JPEG
        run: xvfb-run -a env SOLO_MCP_X11_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_inspect_e2e.py -v

  playwright-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium in CI
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install-deps chromium
      - name: Prepare Solo-MCP private tool kit
        run: python -c 'import solo_kit; solo_kit.prepare()'
      - name: Inspect real localhost app
        run: SOLO_MCP_BROWSER_TESTS=1 python -m unittest discover -s tests -p test_inspect_e2e.py -v


  deb-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaging metadata and safety in isolation
        run: python3 -m unittest discover -s tests -p test_deb_packaging.py -v
      - name: Build Solo Debian package
        run: python3 packaging/deb/build.py --version 1.0.1 --output dist
      - name: Install and remove the package on disposable Ubuntu runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solo-mcp"
          printf '{"test":"preserve"}\n' > "$HOME/.config/solo-mcp/config.json"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ./dist/solo-agent_1.0.1_all.deb
          test -x /usr/bin/solo-agent
          test -f /usr/share/applications/solo-agent.desktop
          test -f /usr/share/solo-agent/ui/index.html
          test -f /usr/share/icons/hicolor/128x128/apps/solo-agent.png
          sudo apt-get purge -y -qq solo-agent
          test ! -e /usr/bin/solo-agent
          test ! -e /usr/share/applications/solo-agent.desktop
          grep -q '"test":"preserve"' "$HOME/.config/solo-mcp/config.json"
      - uses: actions/upload-artifact@v4
        with:
          name: solo-debian-package
          path: dist/solo-agent_1.0.1_all.deb
          if-no-files-found: error
