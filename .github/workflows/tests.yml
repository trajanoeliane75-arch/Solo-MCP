name: Solo-MCP tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q solo_mcp.py solo_desktop.py solo_manager.py solo_git.py solo_images.py solo_inspect.py solo_kit.py solo_projects.py solo_workspaces.py solo_sandbox.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install headless desktop display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth tk imagemagick x11-utils
      - name: Smoke test actual Tkinter GUI
        run: xvfb-run -a env SOLO_MCP_GUI_TESTS=1 python -m unittest discover -s tests -p test_manager.py -v
      - name: Smoke test selected X11 window JPEG
        run: xvfb-run -a env SOLO_MCP_X11_TESTS=1 python -m unittest discover -s tests -p test_inspect_e2e.py -v

  playwright-smoke:
    name: Playwright browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium in CI
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install-deps chromium
      - name: Prepare Solo-MCP private tool kit
        run: python -c 'import solo_kit; solo_kit.prepare()'
      - name: Inspect real localhost app
        run: SOLO_MCP_BROWSER_TESTS=1 python -m unittest discover -s tests -p test_inspect_e2e.py -v
